<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fate Summoning Chamber - Login</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="navbar">
    <div class="logo">✨ Fate Summoning Chamber</div>
    <ul class="nav-links" id="nav-links">
      <li><a href="index.html" class="active">Login</a></li>
    </ul>
    <div>
      <span class="user-info" id="user-info"></span>
      <button class="logout-btn hidden" id="logout-btn" onclick="logout()">Logout</button>
    </div>
  </nav>

  <div class="container">
    <div class="card" style="max-width:400px;margin:60px auto;">
      <h2 style="text-align:center;">Enter the Chamber</h2>

      <div id="error-msg"></div>

      <input type="text" id="username" placeholder="Master name...">
      <input type="password" id="password" placeholder="Password (min 6 chars)...">

      <div class="btn-group" style="flex-direction:column;">
        <button onclick="handleLogin()">Login</button>
        <button onclick="handleRegister()" style="background:linear-gradient(135deg,#1a4a8b,#2a6acc);color:#e0d8c0;">Register New Master</button>
      </div>
    </div>
  </div>

  <script src="js/app.js"></script>
  <script>
    async function handleLogin() {
      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value;
      if (!username || !password) return showError("Enter username and password!");

      const result = await loginUser(username, password);
      if (result.success) {
        window.location.href = "dashboard.html";
      } else {
        showError(result.error);
      }
    }

    async function handleRegister() {
      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value;
      if (!username || !password) return showError("Enter username and password!");
      if (password.length < 6) return showError("Password must be at least 6 characters!");

      const result = await registerUser(username, password);
      if (result.success) {
        window.location.href = "dashboard.html";
      } else {
        showError(result.error);
      }
    }

    function showError(msg) {
      document.getElementById("error-msg").innerHTML = `<div class="error-msg">${msg}</div>`;
    }
  </script>
</body>
</html>
